<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arena Overlay</title>
<link rel="stylesheet" href="/overlay/overlay.css">
</head>
<body>
<div id="root"></div>
<script type="module">
import { mountHealth, mountAlerts, mountTiers, mountScoreboard, mountLeaderboard, start } from '/overlay/widgets.js';
import { params } from '/overlay/common.js';
const root = document.getElementById('root');
const num = (k, d) => (params.has(k) ? Number(params.get(k)) : d);
const health = mountHealth(root, { bottom: num('hp', 330) });
const alerts = mountAlerts(root, { top: num('top', 360) });
const tiers = mountTiers(root, { bottom: num('bottom', 20) });
const score = mountScoreboard(root, { top: num('score', 24) });
const board = mountLeaderboard(root, { left: 20, bottom: num('lb', 600) });
start({ health, alerts, tiers, score, board, wasted: true });
</script>
</body>
</html>

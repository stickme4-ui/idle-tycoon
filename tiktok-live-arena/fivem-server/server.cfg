# ================================================================
#  Live Arena - local FiveM server (only reachable from this PC)
# ================================================================

# Listen on localhost only -> nobody from outside can join.
endpoint_add_tcp "127.0.0.1:30120"
endpoint_add_udp "127.0.0.1:30120"

sv_hostname "Live Arena (local)"
sets sv_projectName "Live Arena"
sets sv_projectDesc "TikTok LIVE interactive arena"
sv_maxclients 2

# Do not list this server on the public server list.
sv_master1 ""

# OneSync + a modern game build (needed for newer GTA peds/weapons).
set onesync on
sv_enforceGameBuild 3095

# Your free Cfx.re key lives in license.cfg (START_FIVEM.bat creates it for you).
exec license.cfg

# Optional: override where the Live Arena Node server is (normally automatic).
# set live_arena_url "http://127.0.0.1:7420"

# ----- resources -----
ensure arena_peds
ensure live_arena
# Add-on ped resources you download go here, e.g.:
# ensure my_superhero_ped
